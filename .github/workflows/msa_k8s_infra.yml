name : don-forget infra deploy

on:
  workflow_dispatch: # 수동으로 workflow를 실행할 수 있게 해주는 이벤트, 이 이벤트가 있어야 github에서 Actions 탭에 들어가서 Run workflow 버튼을 누를 수 있다.
  


#내부에 job들은 여러개 있을 수 있음      
jobs:
  build-and-deploy: # job의 이름(build-and-deploy는 내가 지은 이름)
    
    #runner
    runs-on: ubuntu-latest # 어떤 환경에서 job이 실행될 것인지(ubuntu-latest, windows-latest, macos-latest)
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#available-github-hosted-runners-and-hardware-resources
    steps:
        # 소스코드 체크아웃
      - name: Check out github
        # user는 약속되어 있는 명령어를 가져와 사용하는 것
        uses: actions/checkout@v2 # github에서 코드를 체크아웃하는 액션
        # 리눅스 환경에서 kubectl을 설치하기 위한 액션
      - name : install kubectl
        uses: azure/setup-kubectl@v3 
        with:
          version: 'v1.34.1' # kubectl의 버전

        # aws 인증을 위한 액션(git의 secrets에 작성한 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY를 사용)
      - name : aws configure
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: aws eks cluster update
        run: aws eks update-kubeconfig --region ap-northeast-2 --name don-forget-cluster

      - name: aws ecr login
        uses: aws-actions/amazon-ecr-login@v1

      # Ingress Controller 적용
      - name: deploy ingress
        run: |
          kubectl apply -f ./infra/don-forget-ingress.yml
      
      # Redis 배포
      - name: deploy rabbitmq
        run: |
          kubectl apply -f ./infra/don-forget-rabbitMQ.yml

      # Zookeeper 배포
      - name: deploy zookeeper
        run: |
          kubectl apply -f ./infra/don-forget-zookeeper.yml

      # Kafka 배포
      - name: deploy kafka
        run: |
          kubectl apply -f ./infra/don-forget-kafka.yml

      # Redis 배포
      - name: deploy redis
        run: |
          kubectl apply -f ./infra/don-forget-redis.yml
      

      # 배포 확인
      - name: check pods
        run: |
          kubectl get pods -n lgcns

      - name: check services
        run: |
          kubectl get svc -n lgcns